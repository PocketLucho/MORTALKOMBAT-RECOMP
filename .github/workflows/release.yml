name: build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # Windows build cross-compiled on Linux (MinGW-w64): no need to wait for a Windows runner
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SDL_VER: 2.30.9
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix zip
          curl -sSL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VER/SDL2-devel-$SDL_VER-mingw.tar.gz
          tar xzf sdl.tar.gz
      - name: Build
        run: |
          make -j4 BUILD=build/win CXX=x86_64-w64-mingw32-g++-posix CC=x86_64-w64-mingw32-gcc-posix AR=x86_64-w64-mingw32-ar build/win/libcore.a
          make win WINCC=x86_64-w64-mingw32-gcc-posix WINCXX=x86_64-w64-mingw32-g++-posix SDL2W=$PWD/SDL2-$SDL_VER/x86_64-w64-mingw32
          file dist/MKRecomp/MKRecomp.exe
      - name: Package
        run: |
          mkdir -p out/MKRecomp/roms
          cp dist/MKRecomp/MKRecomp.exe dist/MKRecomp/*.txt out/MKRecomp/
          cp dist/MKRecomp/roms/LEEME_README.txt out/MKRecomp/roms/
          cd out && zip -r ../MKRecomp-windows-x64.zip MKRecomp
      - uses: actions/upload-artifact@v4
        with:
          name: MKRecomp-windows-x64
          path: MKRecomp-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: MKRecomp-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: |
          make -j4 build/linux/libcore.a build/linux/miniz.o build/linux/cattest
          make linux-app SDL2L=/usr LINUX_SDL=-lSDL2
      - name: Package
        run: |
          mkdir -p out/MKRecomp/roms
          cp build/linux/MKRecomp dist/MKRecomp/*.txt out/MKRecomp/
          cp dist/MKRecomp/roms/LEEME_README.txt out/MKRecomp/roms/
          tar -C out -czf MKRecomp-linux-x64.tar.gz MKRecomp
      - uses: actions/upload-artifact@v4
        with:
          name: MKRecomp-linux-x64
          path: MKRecomp-linux-x64.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: MKRecomp-linux-x64.tar.gz
