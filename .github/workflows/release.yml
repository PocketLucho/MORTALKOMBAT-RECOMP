name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 zip
      - name: Build
        run: |
          make -j4 BUILD=build/win CXX=g++ build/win/libcore.a
          make win WINCC=gcc WINCXX=g++ SDL2W=/mingw64
      - name: Package
        run: |
          mkdir -p out/MKRecomp/roms
          cp dist/MKRecomp/MKRecomp.exe dist/MKRecomp/*.txt out/MKRecomp/
          cp dist/MKRecomp/roms/LEEME_README.txt out/MKRecomp/roms/
          cd out && zip -r ../MKRecomp-windows-x64.zip MKRecomp
      - uses: actions/upload-artifact@v4
        with:
          name: MKRecomp-windows-x64
          path: MKRecomp-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: MKRecomp-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: |
          make -j4 build/linux/libcore.a build/linux/miniz.o build/linux/cattest
          make linux-app SDL2L=/usr LINUX_SDL=-lSDL2
      - name: Package
        run: |
          mkdir -p out/MKRecomp/roms
          cp build/linux/MKRecomp dist/MKRecomp/*.txt out/MKRecomp/
          cp dist/MKRecomp/roms/LEEME_README.txt out/MKRecomp/roms/
          tar -C out -czf MKRecomp-linux-x64.tar.gz MKRecomp
      - uses: actions/upload-artifact@v4
        with:
          name: MKRecomp-linux-x64
          path: MKRecomp-linux-x64.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: MKRecomp-linux-x64.tar.gz
